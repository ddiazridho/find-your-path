<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 180" fill="none">
  <defs>
    <linearGradient id="hw-bg" x1="0" y1="0" x2="440" y2="180" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1B3329" />
      <stop offset="1" stop-color="#0F241A" />
    </linearGradient>
    <pattern id="hw-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#254A3A" stroke-width="0.8" opacity="0.4"/>
    </pattern>
  </defs>
  <!-- Background -->
  <rect width="440" height="180" rx="10" fill="url(#hw-bg)"/>
  <rect width="440" height="180" rx="10" fill="url(#hw-grid)"/>

  <!-- Trace lines -->
  <path d="M 30 50 L 90 50 L 120 80 L 170 80" stroke="#3D755D" stroke-width="2" stroke-linecap="round"/>
  <path d="M 40 130 L 100 130 L 130 100 L 170 100" stroke="#3D755D" stroke-width="2" stroke-linecap="round"/>
  <path d="M 270 90 L 320 90 L 350 60 L 400 60" stroke="#4F9577" stroke-width="2" stroke-linecap="round"/>
  <path d="M 270 110 L 310 110 L 340 140 L 410 140" stroke="#3D755D" stroke-width="2" stroke-linecap="round"/>
  <path d="M 220 30 L 220 50" stroke="#4F9577" stroke-width="2" stroke-linecap="round"/>
  <path d="M 220 130 L 220 155" stroke="#3D755D" stroke-width="2" stroke-linecap="round"/>

  <!-- Solder pads -->
  <circle cx="30" cy="50" r="4" fill="#689D49"/>
  <circle cx="40" cy="130" r="4" fill="#689D49"/>
  <circle cx="400" cy="60" r="4" fill="#93B891"/>
  <circle cx="410" cy="140" r="4" fill="#689D49"/>

  <!-- Main Chip Package -->
  <rect x="170" y="50" width="100" height="80" rx="6" fill="#142B21" stroke="#4E8C70" stroke-width="2"/>
  <rect x="180" y="60" width="80" height="60" rx="4" fill="#1B382C"/>
  <circle cx="188" cy="68" r="3" fill="#689D49"/>
  <text x="220" y="88" fill="#EFF6D6" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="1.5">MCU-32</text>
  <text x="220" y="103" fill="#8CA294" font-family="monospace" font-size="8" text-anchor="middle">ARM-CORTEX</text>

  <!-- Pins Left -->
  <line x1="162" y1="65" x2="170" y2="65" stroke="#C2D5BB" stroke-width="2"/>
  <line x1="162" y1="75" x2="170" y2="75" stroke="#C2D5BB" stroke-width="2"/>
  <line x1="162" y1="85" x2="170" y2="85" stroke="#C2D5BB" stroke-width="2"/>
  <line x1="162" y1="95" x2="170" y2="95" stroke="#C2D5BB" stroke-width="2"/>
  <line x1="162" y1="105" x2="170" y2="105" stroke="#C2D5BB" stroke-width="2"/>
  <line x1="162" y1="115" x2="170" y2="115" stroke="#C2D5BB" stroke-width="2"/>

  <!-- Pins Right -->
  <line x1="270" y1="65" x2="278" y2="65" stroke="#C2D5BB" stroke-width="2"/>
  <line x1="270" y1="75" x2="278" y2="75" stroke="#C2D5BB" stroke-width="2"/>
  <line x1="270" y1="85" x2="278" y2="85" stroke="#C2D5BB" stroke-width="2"/>
  <line x1="270" y1="95" x2="278" y2="95" stroke="#C2D5BB" stroke-width="2"/>
  <line x1="270" y1="105" x2="278" y2="105" stroke="#C2D5BB" stroke-width="2"/>
  <line x1="270" y1="115" x2="278" y2="115" stroke="#C2D5BB" stroke-width="2"/>

  <!-- Oscilloscope Mini Monitor Left -->
  <rect x="25" y="70" width="85" height="48" rx="5" fill="#0D1E16" stroke="#2D5A46" stroke-width="1.5"/>
  <path d="M 30 94 Q 40 76 50 94 T 70 94 T 90 94 T 105 94" fill="none" stroke="#68E18B" stroke-width="1.8"/>
  <text x="32" y="82" fill="#8CA294" font-family="monospace" font-size="7">CLK: 16MHz</text>

  <!-- Status Module Right -->
  <rect x="330" y="80" width="85" height="42" rx="5" fill="#0D1E16" stroke="#2D5A46" stroke-width="1.5"/>
  <circle cx="344" cy="95" r="4" fill="#68E18B"/>
  <text x="355" y="98" fill="#EFF6D6" font-family="system-ui, sans-serif" font-size="8" font-weight="600">AKTIF</text>
  <text x="344" y="112" fill="#8CA294" font-family="monospace" font-size="7">3.3V · I2C OK</text>

  <!-- Tag badge -->
  <rect x="16" y="16" width="118" height="20" rx="4" fill="#254A3A" opacity="0.85"/>
  <text x="75" y="30" fill="#D8EADB" font-family="system-ui, sans-serif" font-size="9" font-weight="700" text-anchor="middle" letter-spacing="0.5">LAB ELEKTRONIKA</text>
</svg>
